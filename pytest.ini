[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test mode
asyncio_mode = auto

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:warnings

# Markers for test categorization
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    live: marks tests requiring live services (deselect with '-m "not live"')
    unit: marks unit tests (select with '-m unit')
    integration: marks integration tests (select with '-m integration')

